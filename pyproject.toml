[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daytona-gym"
version = "0.1.0"
description = "Portable RL rollout environments and observability for existing trainers."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Daytona" }]
dependencies = [
    "daytona>=0.198.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
dg = "daytona_gym.cli:inspect_entry"
daytona-gym = "daytona_gym.cli:inspect_entry"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["daytona_gym"]


[tool.hatch.build.targets.sdist]
include = [
  "daytona_gym",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "e2e: live Daytona API tests (opt-in with --e2e or pytest tests/e2e)",
]
