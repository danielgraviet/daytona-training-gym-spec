[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daytona-gym"
version = "0.1.0"
description = "Portable RL rollout environments and observability for existing trainers."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Daytona" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["daytona_gym"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
