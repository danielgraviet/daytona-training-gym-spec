name: worker-image

# Builds ghcr.io/<owner>/daytona-gym-worker on top of slimerl/slime (ROADMAP 3.1).
on:
  push:
    branches: [main]
    paths:
      - "daytona_gym/**"
      - "pyproject.toml"
      - "docker/worker/**"
      - ".dockerignore"
      - ".github/workflows/worker-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: worker-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/daytona-gym-worker
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null
          df -h / /mnt

      # The base image is ~21 GB compressed and unpacks to far more than the
      # root disk holds; the runner's /mnt disk is much larger.
      - name: Move Docker storage to /mnt
        run: |
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          sudo python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("/etc/docker/daemon.json")
          cfg = json.loads(p.read_text()) if p.exists() and p.read_text().strip() else {}
          cfg["data-root"] = "/mnt/docker"
          p.write_text(json.dumps(cfg))
          PY
          sudo systemctl start docker
          docker info --format 'docker root: {{.DockerRootDir}}'

      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: docker build -f docker/worker/Dockerfile -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" .

      - name: Smoke test (no GPU needed)
        run: |
          docker run --rm "$IMAGE:${GITHUB_SHA}" python3 -c "
          import daytona_gym, daytona
          from daytona_gym.gym.models import Qwen25_05B
          m = Qwen25_05B()
          assert m.resolved_hf_checkpoint() == '/models/Qwen2.5-0.5B-Instruct/', m.resolved_hf_checkpoint()
          print('ok', daytona_gym.__version__)"
          docker run --rm "$IMAGE:${GITHUB_SHA}" dg --help | head -3

      - name: Push
        run: |
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
          df -h /mnt
